<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header-band">
    <h1>Book Library</h1>
</div>

<div class="container">
    <div class="section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <button onclick="loadLibrary()">Load Books</button>
            <a href="index.html" class="btn" style="background-color: #64748B;">Main App</a>
        </div>

        <div id="libraryContainer">
            <p class="status-msg">Click the button above to query your active RDF model.</p>
        </div>
    </div>
</div>

<div class="chat-widget">
    <div class="chat-header">
        <span>Library AI Assistant</span>
    </div>

    <div class="chat-body" id="chatBody">
        <div class="chat-message msg-ai">
            Hello! Ask me about books!
        </div>
    </div>

    <div class="chat-starters" id="chatStarters">
    </div>

    <div class="chat-input-area">
        <input type="text" id="chatInput" class="chat-input" placeholder="Type a message...">
        <button onclick="sendChatMessage()" class="btn btn-back">Send</button>
    </div>
</div>

<script>
    function loadLibrary() {
        const container = document.getElementById('libraryContainer');
        container.innerHTML = '<p class="status-msg" style="color: #0EA5E9;">Querying Jena Model...</p>';

        fetch('/api/rdf/books/list')
            .then(response => response.json())
            .then(data => {
                container.innerHTML = '';

                if (data.status === 'error') {
                    container.innerHTML = `<div class="error-box">${data.message}</div>`;
                    return;
                }

                if (!data.books || data.books.length === 0) {
                    container.innerHTML = '<p class="status-msg">No books found. Did you upload your ontology first?</p>';
                    return;
                }

                let html = '<div class="book-grid">';
                data.books.forEach(book => {
                    html += `
                            <div class="book-card">
                                <div>
                                    <h3>${book.name}</h3>
                                </div>
                                <a href="book.html?name=${encodeURIComponent(book.name)}" class="btn" style="text-align: center; margin: 0; width: 100%; box-sizing: border-box;"> View Details </a>
                            </div>
                        `;
                });
                html += '</div>';
                container.innerHTML = html;
            })
            .catch(err => {
                console.error(err);
                container.innerHTML = '<div class="error-box">Could not reach the Spring Boot API.</div>';
            });
    }

    function loadStarters() {
        const startersContainer = document.getElementById('chatStarters');
        let starters = [];

        if (bookName) {
            const decodedName = decodeURIComponent(bookName);
            starters = [
                `Who is the author of ${decodedName}?`,
                `What is the main theme of ${decodedName}?`,
                `Recommend me another book similar to ${decodedName}.`
            ];
        } else {
            starters = [
                "Do you have any Science Fiction books?",
                "List all the books suitable for Beginners."
            ];
        }

        starters.forEach(text => {
            const btn = document.createElement('button');
            btn.className = 'starter-btn';
            btn.innerText = text;
            btn.onclick = () => {
                document.getElementById('chatInput').value = text;
                sendChatMessage();
            };
            startersContainer.appendChild(btn);
        });
    }

    function sendChatMessage() {
        const input = document.getElementById('chatInput');
        const message = input.value.trim();
        if (!message) return;

        const chatBody = document.getElementById('chatBody');

        chatBody.innerHTML += `<div class="chat-message msg-user">${message}</div>`;
        input.value = '';
        chatBody.scrollTop = chatBody.scrollHeight;

        const loadId = 'load-' + Date.now();

        chatBody.innerHTML += `<div id="${loadId}" class="chat-message msg-ai" style="opacity: 0.7;">Searching Vector DB...</div>`;
        chatBody.scrollTop = chatBody.scrollHeight;

        fetch('/api/chat/ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: message })
        })
            .then(response => response.json())
            .then(data => {
                document.getElementById(loadId).remove();
                if (data.status === 'error') {
                    chatBody.innerHTML += `<div class="chat-message msg-ai error-box" style="margin-top: 0;">${data.message}</div>`;
                } else {
                    chatBody.innerHTML += `<div class="chat-message msg-ai">${data.reply}</div>`;
                }
                chatBody.scrollTop = chatBody.scrollHeight;
            })
            .catch(err => {
                document.getElementById(loadId).remove();
                chatBody.innerHTML += `<div class="chat-message msg-ai error-box" style="margin-top: 0;">Connection to Java server failed.</div>`;
                chatBody.scrollTop = chatBody.scrollHeight;
            });
    }

    document.getElementById('chatInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') sendChatMessage();
    });

    window.onload = loadStarters;
</script>
</body>
</html>
