<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Details</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header-band">
    <h1>Book Details</h1>
</div>

<div class="container" style="max-width: 650px;">
    <div class="detail-card">

        <h1 id="bookTitle" style="color: #0369A1; margin: 0; font-size: 2.2em;">Loading...</h1>

        <hr style="border: 0; border-top: 1px solid #E2E8F0; margin: 25px 0;">

        <div id="bookDetails" style="display: none;">
            <div>
                <label class="detail-label">Themes</label>
                <span id="bookThemes" class="badge badge-theme"></span>
            </div>

            <div>
                <label class="detail-label">Target Reading Level</label>
                <span id="bookLevel" class="badge badge-level"></span>
            </div>
        </div>

        <div id="errorMessage" class="error-box" style="display: none;"></div>

        <hr style="border: 0; border-top: 1px solid #E2E8F0; margin: 30px 0 20px 0;">

        <a href="bookslist.html" class="btn" style="background-color: #64748B; margin: 0;"> Back to Books</a>
    </div>

</div>

<div class="chat-widget">
    <div class="chat-header">
        <span>Library AI Assistant</span>
    </div>

    <div class="chat-body" id="chatBody">
        <div class="chat-message msg-ai">
            Hello! I am connected to the RDF Knowledge Graph. Ask me about this book!
        </div>
    </div>

    <div class="chat-starters" id="chatStarters">
    </div>

    <div class="chat-input-area">
        <input type="text" id="chatInput" class="chat-input" placeholder="Type a message...">
        <button onclick="sendChatMessage()" class="btn btn-back">Send</button>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const bookName = urlParams.get('name');

    if (!bookName) {
        document.getElementById('bookTitle').innerText = "Error";
        const err = document.getElementById('errorMessage');
        err.innerText = "No resource name found in the URL.";
        err.style.display = 'block';
    } else {
        fetch(`/api/rdf/books/details?name=${encodeURIComponent(bookName)}`)
            .then(response => response.json())
            .then(data => {
                if (data.status === 'error') {
                    document.getElementById('bookTitle').innerText = "Not Found";
                    const err = document.getElementById('errorMessage');
                    err.innerText = data.message;
                    err.style.display = 'block';
                } else {
                    document.getElementById('bookTitle').innerText = data.name;
                    document.getElementById('bookThemes').innerText = data.themes || 'None';
                    document.getElementById('bookLevel').innerText = data.level || 'Unknown';
                    document.getElementById('bookDetails').style.display = 'block';
                }
            })
            .catch(err => {
                document.getElementById('bookTitle').innerText = "Network Error";
                const errorBox = document.getElementById('errorMessage');
                errorBox.innerText = "Unable to connect to the local Spring server.";
                errorBox.style.display = 'block';
            });
    }

    function loadStarters() {
        const startersContainer = document.getElementById('chatStarters');
        let starters = [];

        if (bookName) {
            const decodedName = decodeURIComponent(bookName);
            starters = [
                `Who is the author of ${decodedName}?`,
                `What is the main theme of ${decodedName}?`,
                `Recommend me another book similar to ${decodedName}.`
            ];
        } else {
            starters = [
                "Do you have any Science Fiction books?",
                "List all the books suitable for Beginners."
            ];
        }

        starters.forEach(text => {
            const btn = document.createElement('button');
            btn.className = 'starter-btn';
            btn.innerText = text;
            btn.onclick = () => {
                document.getElementById('chatInput').value = text;
                sendChatMessage();
            };
            startersContainer.appendChild(btn);
        });
    }

    function sendChatMessage() {
        const input = document.getElementById('chatInput');
        const message = input.value.trim();
        if (!message) return;

        const chatBody = document.getElementById('chatBody');

        chatBody.innerHTML += `<div class="chat-message msg-user">${message}</div>`;
        input.value = '';
        chatBody.scrollTop = chatBody.scrollHeight;

        const loadId = 'load-' + Date.now();

        chatBody.innerHTML += `<div id="${loadId}" class="chat-message msg-ai" style="opacity: 0.7;">Searching Vector DB...</div>`;
        chatBody.scrollTop = chatBody.scrollHeight;

        fetch('/api/chat/ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: message })
        })
            .then(response => response.json())
            .then(data => {
                document.getElementById(loadId).remove();
                if (data.status === 'error') {
                    chatBody.innerHTML += `<div class="chat-message msg-ai error-box" style="margin-top: 0;">${data.message}</div>`;
                } else {
                    chatBody.innerHTML += `<div class="chat-message msg-ai">${data.reply}</div>`;
                }
                chatBody.scrollTop = chatBody.scrollHeight;
            })
            .catch(err => {
                document.getElementById(loadId).remove();
                chatBody.innerHTML += `<div class="chat-message msg-ai error-box" style="margin-top: 0;">Connection to Java server failed.</div>`;
                chatBody.scrollTop = chatBody.scrollHeight;
            });
    }

    document.getElementById('chatInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') sendChatMessage();
    });

    window.onload = loadStarters;
</script>
</body>
</html>
