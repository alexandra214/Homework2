<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Recommender</title>
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>
<body>

<div class="header-band">
    <h1>Book Recommender</h1>
</div>

<div class="container">
    <div class="section">
        <h2>RDF Graph Visualizer </h2>
        <h3>Upload RDF/XML File</h3>
        <form id="uploadForm">
            <input type="file" id="rdfFile" name="file" accept=".xml,.rdf" required>
            <button type="submit">Visualize Graph</button>
        </form>

        <div id="mynetwork"></div>
    </div>

    <div class="section">
        <h3>Add a New Book</h3>

        <form id="addBookForm">
            <input type="text" id="newBookName" placeholder="Book Name" required>
            <input type="text" id="newBookTheme" placeholder="Theme" required>
            <select id="newBookLevel" required>
                <option value="" disabled selected>Select Reading Level</option>
                <option value="Beginner">Beginner</option>
                <option value="Intermediate">Intermediate</option>
                <option value="Advanced">Advanced</option>
            </select>
            <button type="submit">Add Book</button>
        </form>
    </div>

    <div class="section">
        <h3>Modify Reading Level</h3>
        <form id="modifyBookForm">
            <input type="text" id="modBookName" placeholder="Book Name" required>
            <select id="modBookLevel" required>
                <option value="" disabled selected>Select New Reading Level</option>
                <option value="Beginner">Beginner</option>
                <option value="Intermediate">Intermediate</option>
                <option value="Advanced">Advanced</option>
            </select>
            <button type="submit">Update Level</button>
        </form>

        <div id="manageResultMessage" class="result-message"></div>

        <a href="/api/rdf/export" class="btn btn-download">Download Updated RDF</a>
    </div>

    <div class="section">
        <a href="bookslist.html" class="btn btn-download">Book Library</a>
    </div>
</div>

<script>
    document.getElementById('uploadForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const fileInput = document.getElementById('rdfFile');
        const formData = new FormData();
        formData.append("file", fileInput.files[0]);

        try {
            const response = await fetch('/api/rdf/upload', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (data.status === "success") {
                const container = document.getElementById('mynetwork');
                const graphData = {
                    nodes: new vis.DataSet(data.nodes),
                    edges: new vis.DataSet(data.edges)
                };
                const options = {
                    edges: { arrows: 'to' },
                    nodes: { shape: 'box', color: '#BAE6FD', font: { color: '#0369A1' } }
                };
                new vis.Network(container, graphData, options);
            } else {
                alert("Error parsing RDF: " + data.message);
            }
        } catch (error) {
            console.error("Upload failed:", error);
            alert("Failed to connect to the server.");
        }
    });

    document.getElementById('addBookForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const name = document.getElementById('newBookName').value;
        const theme = document.getElementById('newBookTheme').value;
        const level = document.getElementById('newBookLevel').value;

        try {
            const response = await fetch(`/api/rdf/books/add?name=${name}&theme=${theme}&level=${level}`, { method: 'POST' });
            const text = await response.text();
            document.getElementById('manageResultMessage').innerText = text;
        } catch (error) {
            document.getElementById('manageResultMessage').innerText = "Error connecting to server.";
        }
    });

    document.getElementById('modifyBookForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const name = document.getElementById('modBookName').value;
        const level = document.getElementById('modBookLevel').value;

        try {
            const response = await fetch(`/api/rdf/books/update?name=${name}&level=${level}`, { method: 'PUT' });
            const text = await response.text();
            document.getElementById('manageResultMessage').innerText = text;
        } catch (error) {
            document.getElementById('manageResultMessage').innerText = "Error connecting to server.";
        }
    });
</script>
</body>
</html>
